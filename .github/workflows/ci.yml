name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: SDK is up to date with the spec
        run: npm run check:sdk
      - name: Type check
        run: npm run typecheck
      - name: Tests (sandbox, SDK, spec contract)
        run: npm test
