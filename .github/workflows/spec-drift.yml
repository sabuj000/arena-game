name: spec-drift

# The spec lives in arena-docs. This copy can fall behind when arena-docs changes, so check every night.
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Spec matches arena-docs
        run: npm run check:spec-drift
